<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mechanism Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f0d; --surface: #101613; --surface-2: #161f1b;
    --border: #223029; --text: #eef4f1; --text-muted: #8ba39b;
    --accent: #2dd4a7; --accent-dim: #1f9d7c; --accent-soft: rgba(45,212,167,0.14);
    --accent-ink: #04140f; --red: #ff6b5e; --red-soft: rgba(255,107,94,0.14);
    --amber: #f2b134; --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f2e8; --surface: #fffdf8; --surface-2: #efe9d7;
      --border: #ddd4bc; --text: #16211b; --text-muted: #5f6a60;
      --accent: #0f8f70; --accent-dim: #0c6e56; --accent-soft: rgba(15,143,112,0.1);
      --accent-ink: #f5fffb; --red: #c8433a; --red-soft: rgba(200,67,58,0.1); --amber: #b3791b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    background-color: var(--bg);
    background-image: linear-gradient(rgba(45,212,167,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(45,212,167,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text); font-family: 'Archivo', -apple-system, sans-serif;
  }
  #app { width: 100%; max-width: 700px; padding: 20px 16px 48px; }
  .brandbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 18px;
  }
  .brandbar .tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .brandbar .title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; margin-top: 2px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px 22px; box-shadow: 0 8px 24px -12px rgba(0,0,0,0.3);
  }
  h1 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0 0 10px; }
  p.lead { font-size: 15px; line-height: 1.6; color: var(--text-muted); margin: 0 0 18px; }
  .stat-row { display: flex; gap: 10px; margin: 18px 0; }
  .stat { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
  .stat .num { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: var(--accent); display: block; }
  .stat .lbl { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  button { font-family: inherit; cursor: pointer; }
  button.primary {
    width: 100%; padding: 13px; margin-top: 10px; background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
  }
  button.secondary {
    width: 100%; padding: 11px; margin-top: 10px; background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent); border-radius: 10px; font-size: 14px;
  }
  button.ghost {
    padding: 7px 12px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 20px; font-size: 12px;
  }
  button.ghost.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .progress-bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }
  .cat-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; display: inline-block; margin-bottom: 10px; }
  .icon-wrap { display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 22px; margin-bottom: 14px; color: var(--accent); }
  .icon-wrap svg { width: 56px; height: 56px; }
  .q-prompt { font-size: 16px; font-weight: 600; margin-bottom: 4px; line-height: 1.5; }
  .hint-box { font-size: 13.5px; color: var(--text-muted); background: var(--surface-2); border-left: 2px solid var(--accent); padding: 8px 12px; border-radius: 6px; margin: 10px 0; display: none; }
  .hint-box.show { display: block; }
  input.answer {
    width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--text); margin-top: 6px;
  }
  input.answer:focus { outline: none; border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row button { flex: 1; }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .feedback.incorrect { background: var(--red-soft); border-left: 3px solid var(--red); }
  .feedback b { display: block; margin-bottom: 4px; }
  .skip-link-btn { display: block; text-align: center; width: 100%; background: none; border: none; color: var(--text-muted); font-size: 12.5px; margin-top: 10px; text-decoration: underline; }
  .review-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .review-item:last-child { border-bottom: none; }
  .review-item .r-prompt { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .review-item .r-status { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-bottom: 6px; }
  .r-status.correct { background: var(--accent-soft); color: var(--accent); }
  .r-status.wrong { background: var(--red-soft); color: var(--red); }
  .r-status.skipped { background: var(--surface-2); color: var(--text-muted); }
  .r-detail { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="app">
  <div class="brandbar">
    <div>
      <div class="tag">Pharmacology · Quiz Game</div>
      <div class="title">Mechanism Match</div>
    </div>
  </div>
  <div id="screen"></div>
</div>
<script>
(function () {
  "use strict";

  var ICONS = {
    "Cardiovascular": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.7-9C.7 8 1.8 4.8 4.7 3.9c2-.6 4 .2 5.3 2 1.3-1.8 3.3-2.6 5.3-2 2.9.9 4 4.1 2.4 7.6-2.2 4.4-9.7 9-9.7 9Z"/><path d="M4 11h4l1.5-3 2 6 1.5-3H18"/></svg>',
    "Antibiotics": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="4" transform="rotate(45 12 12)"/><path d="M9 12h6M12 9v6"/></svg>',
    "Toxicology & Antidotes": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg>',
    "Endocrine": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13 16 9M9 3h6"/></svg>',
    "Emergency": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke-linejoin="round"/></svg>'
  };

  var ALL_QUESTIONS = [
    { cat: "Cardiovascular", prompt: "Which enzyme do ACE inhibitors block, preventing angiotensin I from becoming angiotensin II?", answers: ["angiotensin-converting enzyme", "ace"], hint: "It's right in the drug class name.", explain: "ACE inhibitors block angiotensin-converting enzyme, reducing vasoconstriction and aldosterone release — and causing cough/angioedema via bradykinin accumulation." },
    { cat: "Cardiovascular", prompt: "What do dihydropyridine calcium channel blockers primarily target?", answers: ["l-type calcium channels", "l-type calcium channel", "calcium channels"], hint: "The same channel type found in vascular smooth muscle.", explain: "Dihydropyridines (e.g., amlodipine) block L-type calcium channels, causing vasodilation with relatively little cardiac effect." },
    { cat: "Cardiovascular", prompt: "Which receptor do beta-blockers antagonize to reduce heart rate and myocardial oxygen demand?", answers: ["beta-1 receptors", "beta-1 adrenergic receptors", "beta 1 receptor"], hint: "Cardioselective agents are relatively specific for this one.", explain: "Beta-blockers antagonize beta-1 adrenergic receptors, reducing heart rate, contractility, and oxygen demand." },
    { cat: "Cardiovascular", prompt: "What enzyme do statins inhibit to lower cholesterol synthesis?", answers: ["hmg-coa reductase"], hint: "The rate-limiting step of the cholesterol synthesis pathway.", explain: "Statins competitively inhibit HMG-CoA reductase, the rate-limiting enzyme in hepatic cholesterol synthesis." },
    { cat: "Cardiovascular", prompt: "What does warfarin inhibit to block synthesis of clotting factors II, VII, IX, and X?", answers: ["vitamin k epoxide reductase"], hint: "Named after the vitamin it recycles.", explain: "Warfarin inhibits vitamin K epoxide reductase, blocking the recycling of vitamin K needed to synthesize factors II, VII, IX, X and proteins C/S." },
    { cat: "Cardiovascular", prompt: "Furosemide is what class of diuretic, and where in the nephron does it act?", answers: ["loop diuretic, loop of henle", "loop diuretic"], hint: "Named for its site of action.", explain: "Furosemide is a loop diuretic that blocks the Na-K-2Cl cotransporter in the thick ascending loop of Henle." },
    { cat: "Antibiotics", prompt: "What structure do beta-lactam antibiotics target, by binding penicillin-binding proteins?", answers: ["penicillin-binding proteins", "cell wall", "bacterial cell wall"], hint: "Their whole class is defined by this target.", explain: "Beta-lactams (penicillins, cephalosporins, carbapenems) inhibit bacterial cell wall synthesis by binding penicillin-binding proteins." },
    { cat: "Antibiotics", prompt: "Which ribosomal subunit do aminoglycosides and tetracyclines bind?", answers: ["30s", "30s ribosomal subunit"], hint: "The smaller of the two bacterial ribosomal subunits.", explain: "Aminoglycosides and tetracyclines both target the 30S ribosomal subunit to inhibit bacterial protein synthesis." },
    { cat: "Antibiotics", prompt: "Which ribosomal subunit do macrolides and clindamycin bind?", answers: ["50s", "50s ribosomal subunit"], hint: "The larger of the two bacterial ribosomal subunits.", explain: "Macrolides and clindamycin bind the 50S ribosomal subunit, blocking bacterial protein synthesis." },
    { cat: "Antibiotics", prompt: "What bacterial enzyme do fluoroquinolones inhibit?", answers: ["dna gyrase", "dna gyrase/topoisomerase", "topoisomerase"], hint: "An enzyme needed to supercoil and unwind bacterial DNA.", explain: "Fluoroquinolones inhibit DNA gyrase (topoisomerase II) and topoisomerase IV, blocking bacterial DNA replication." },
    { cat: "Antibiotics", prompt: "Sulfonamides and trimethoprim sequentially block which synthesis pathway?", answers: ["folate synthesis", "folic acid synthesis"], hint: "A vitamin pathway bacteria must make themselves.", explain: "Sulfonamides and trimethoprim block sequential steps of bacterial folate synthesis, starving the bacteria of a needed cofactor." },
    { cat: "Antibiotics", prompt: "Which antibiotic causes 'red man syndrome' when infused too quickly?", answers: ["vancomycin"], hint: "A glycopeptide reserved for serious gram-positive infections.", explain: "Rapid vancomycin infusion triggers non-IgE-mediated histamine release, producing red man syndrome — slow the infusion rather than stopping therapy." },
    { cat: "Toxicology & Antidotes", prompt: "What is the antidote for acetaminophen overdose?", answers: ["n-acetylcysteine", "nac"], hint: "It replenishes a depleted liver antioxidant.", explain: "N-acetylcysteine replenishes glutathione stores, preventing hepatotoxic metabolite accumulation in acetaminophen overdose." },
    { cat: "Toxicology & Antidotes", prompt: "What is the antidote for benzodiazepine overdose (used cautiously)?", answers: ["flumazenil"], hint: "It can precipitate seizures in chronic users.", explain: "Flumazenil is a competitive GABA-A antagonist that reverses benzodiazepine sedation, but risks seizures in dependent patients." },
    { cat: "Toxicology & Antidotes", prompt: "What is the antidote for opioid overdose?", answers: ["naloxone"], hint: "Often needs repeat dosing due to its short half-life.", explain: "Naloxone is a competitive opioid receptor antagonist; its short half-life relative to many opioids means patients can re-sedate." },
    { cat: "Toxicology & Antidotes", prompt: "What is the antidote for acute iron overdose?", answers: ["deferoxamine"], hint: "An iron-chelating agent.", explain: "Deferoxamine chelates free iron, allowing renal excretion of the iron-chelate complex." },
    { cat: "Toxicology & Antidotes", prompt: "What is the antidote for methanol or ethylene glycol poisoning?", answers: ["fomepizole"], hint: "It blocks the enzyme that converts these into toxic metabolites.", explain: "Fomepizole inhibits alcohol dehydrogenase, preventing methanol/ethylene glycol from being metabolized into their toxic byproducts." },
    { cat: "Toxicology & Antidotes", prompt: "What two drugs treat organophosphate poisoning?", answers: ["atropine and pralidoxime", "atropine, pralidoxime"], hint: "One blocks muscarinic effects; the other reactivates an enzyme.", explain: "Atropine blocks the muscarinic (cholinergic) effects, while pralidoxime reactivates acetylcholinesterase before it becomes permanently bound." },
    { cat: "Toxicology & Antidotes", prompt: "What antidote reverses cyanide poisoning by binding it directly?", answers: ["hydroxocobalamin"], hint: "It becomes a form of vitamin B12 after binding the toxin.", explain: "Hydroxocobalamin binds cyanide directly, forming cyanocobalamin, which is then renally excreted." },
    { cat: "Toxicology & Antidotes", prompt: "What reverses warfarin urgently for a life-threatening bleed?", answers: ["4-factor pcc and vitamin k", "prothrombin complex concentrate and vitamin k", "pcc and vitamin k"], hint: "One component acts fast; the other sustains the reversal.", explain: "4-factor prothrombin complex concentrate provides immediate factor replacement, with vitamin K given concurrently for sustained reversal." },
    { cat: "Endocrine", prompt: "Which oral diabetes drug class stimulates pancreatic insulin release independent of glucose level?", answers: ["sulfonylureas"], hint: "This mechanism is also why they carry the highest hypoglycemia risk.", explain: "Sulfonylureas close pancreatic K-ATP channels, triggering insulin secretion regardless of ambient glucose — hence their hypoglycemia risk." },
    { cat: "Endocrine", prompt: "What is the primary mechanism of metformin?", answers: ["decreases hepatic gluconeogenesis", "reduces hepatic glucose production"], hint: "It targets the liver, not the pancreas.", explain: "Metformin primarily decreases hepatic gluconeogenesis and improves peripheral insulin sensitivity, with low intrinsic hypoglycemia risk." },
    { cat: "Endocrine", prompt: "What enzyme do proton pump inhibitors irreversibly inhibit?", answers: ["h+/k+ atpase", "proton pump", "h/k atpase"], hint: "It's the pump they're named after.", explain: "PPIs irreversibly inhibit the H+/K+ ATPase ('proton pump') on gastric parietal cells, suppressing acid secretion." },
    { cat: "Emergency", prompt: "What is the first-line treatment for anaphylaxis, and by what route?", answers: ["im epinephrine", "intramuscular epinephrine", "epinephrine im"], hint: "Not IV, not subcutaneous — think anterolateral thigh.", explain: "Intramuscular epinephrine (anterolateral thigh) is first-line for anaphylaxis, with faster and more reliable absorption than other routes." }
  ];

  var CATEGORIES = [];
  ALL_QUESTIONS.forEach(function (item) { if (CATEGORIES.indexOf(item.cat) === -1) CATEGORIES.push(item.cat); });

  var state = { selectedCats: CATEGORIES.slice(), pool: [], idx: 0, results: [], hintShown: false, answered: false };

  function el(id) { return document.getElementById(id); }
  function normalize(s) { return s.toLowerCase().trim().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " "); }
  function isCorrect(input, answers) {
    var n = normalize(input);
    if (!n) return false;
    return answers.some(function (a) { return normalize(a) === n || n.indexOf(normalize(a)) !== -1 || normalize(a).indexOf(n) !== -1; });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderStart() {
    var savedBest = localStorage.getItem("mechgame:best");
    el("screen").innerHTML =
      '<div class="card">' +
      '<h1>Mechanism Match</h1>' +
      '<p class="lead">' + ALL_QUESTIONS.length + ' prompts across cardiovascular, antibiotic, toxicology, endocrine, and emergency pharmacology — name the mechanism, enzyme, or antidote.</p>' +
      '<div class="stat-row">' +
      '<div class="stat"><span class="num">' + ALL_QUESTIONS.length + '</span><span class="lbl">Questions</span></div>' +
      '<div class="stat"><span class="num">' + CATEGORIES.length + '</span><span class="lbl">Categories</span></div>' +
      '<div class="stat"><span class="num">' + (savedBest || '—') + '</span><span class="lbl">Best score</span></div>' +
      '</div>' +
      '<div class="chip-row" id="cat-chips"></div>' +
      '<button class="primary" id="btn-start">Start quiz</button>' +
      '</div>';
    var chipRow = el("cat-chips");
    CATEGORIES.forEach(function (cat) {
      var b = document.createElement("button");
      b.className = "ghost active";
      b.textContent = cat;
      b.dataset.cat = cat;
      b.addEventListener("click", function () {
        var i = state.selectedCats.indexOf(cat);
        if (i === -1) { state.selectedCats.push(cat); b.classList.add("active"); }
        else { state.selectedCats.splice(i, 1); b.classList.remove("active"); }
      });
      chipRow.appendChild(b);
    });
    el("btn-start").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var filtered = ALL_QUESTIONS.filter(function (q) { return state.selectedCats.indexOf(q.cat) !== -1; });
    if (filtered.length === 0) filtered = ALL_QUESTIONS.slice();
    state.pool = shuffle(filtered);
    state.idx = 0;
    state.results = [];
    renderQuestion();
  }

  function renderQuestion() {
    state.hintShown = false;
    state.answered = false;
    var item = state.pool[state.idx];
    var pct = Math.round((state.idx / state.pool.length) * 100);
    el("screen").innerHTML =
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="card">' +
      '<span class="cat-tag">' + item.cat + ' · ' + (state.idx + 1) + ' / ' + state.pool.length + '</span>' +
      '<div class="icon-wrap">' + ICONS[item.cat] + '</div>' +
      '<p class="q-prompt">' + item.prompt + '</p>' +
      '<button class="skip-link-btn" id="btn-hint" style="text-align:left;padding:0;margin:0 0 4px;">Show hint</button>' +
      '<div class="hint-box" id="hint-box">' + item.hint + '</div>' +
      '<form id="answer-form">' +
      '<input class="answer" id="answer-input" type="text" autocomplete="off" placeholder="Type your answer..." />' +
      '<div class="btn-row">' +
      '<button type="button" class="secondary" id="btn-skip">Skip</button>' +
      '<button type="submit" class="primary" id="btn-submit">Submit</button>' +
      '</div>' +
      '</form>' +
      '<div class="feedback" id="feedback"></div>' +
      '<button class="skip-link-btn" id="btn-next" style="display:none;">Next question →</button>' +
      '</div>';

    el("btn-hint").addEventListener("click", function () {
      state.hintShown = true;
      el("hint-box").classList.add("show");
    });
    el("btn-skip").addEventListener("click", function () { recordAnswer("", true); });
    el("answer-form").addEventListener("submit", function (e) {
      e.preventDefault();
      if (state.answered) return;
      recordAnswer(el("answer-input").value, false);
    });
    el("btn-next").addEventListener("click", advance);
    setTimeout(function () { var i = el("answer-input"); if (i) i.focus(); }, 30);
  }

  function recordAnswer(value, skipped) {
    if (state.answered) return;
    state.answered = true;
    var item = state.pool[state.idx];
    var correct = !skipped && isCorrect(value, item.answers);
    state.results.push({ item: item, userAnswer: value, status: skipped ? "skipped" : correct ? "correct" : "wrong" });

    var fb = el("feedback");
    fb.className = "feedback show " + (skipped ? "incorrect" : correct ? "correct" : "incorrect");
    var label = correct ? "Correct!" : skipped ? "Skipped." : "Not quite.";
    fb.innerHTML = "<b>" + label + "</b>" + (correct ? "" : "Expected: " + item.answers[0] + ". ") + item.explain;

    el("btn-submit").disabled = true;
    el("btn-skip").disabled = true;
    el("answer-input").disabled = true;
    el("btn-next").style.display = "block";
    if (state.idx === state.pool.length - 1) {
      el("btn-next").textContent = "See results →";
    }
  }

  function advance() {
    if (state.idx < state.pool.length - 1) {
      state.idx++;
      renderQuestion();
    } else {
      renderResults();
    }
  }

  function renderResults() {
    var correct = state.results.filter(function (r) { return r.status === "correct"; }).length;
    var total = state.results.length;
    var pct = Math.round((correct / total) * 100);
    var best = parseInt(localStorage.getItem("mechgame:best") || "0", 10);
    if (pct > best) localStorage.setItem("mechgame:best", String(pct));

    el("screen").innerHTML =
      '<div class="card">' +
      '<h1>Results</h1>' +
      '<div class="stat-row">' +
      '<div class="stat"><span class="num">' + correct + '/' + total + '</span><span class="lbl">Correct</span></div>' +
      '<div class="stat"><span class="num">' + pct + '%</span><span class="lbl">Score</span></div>' +
      '</div>' +
      '<button class="primary" id="btn-restart">Play again</button>' +
      '<button class="secondary" id="btn-review">Review all answers</button>' +
      '<div id="review-list"></div>' +
      '</div>';
    el("btn-restart").addEventListener("click", renderStart);
    el("btn-review").addEventListener("click", function () {
      var list = el("review-list");
      list.innerHTML = state.results.map(function (r) {
        return '<div class="review-item">' +
          '<span class="r-status ' + r.status + '">' + r.status + '</span>' +
          '<div class="r-prompt">' + r.item.prompt + '</div>' +
          '<div class="r-detail">' + (r.status !== "correct" ? "Your answer: " + (r.userAnswer || "(none)") + ". " : "") + "Expected: " + r.item.answers[0] + ". " + r.item.explain + '</div>' +
          '</div>';
      }).join("");
    });
  }

  renderStart();
})();
</script>
</body>
</html>
