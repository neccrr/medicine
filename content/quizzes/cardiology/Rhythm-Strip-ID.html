<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Strip ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f0d; --surface: #101613; --surface-2: #161f1b;
    --border: #223029; --text: #eef4f1; --text-muted: #8ba39b;
    --accent: #2dd4a7; --accent-dim: #1f9d7c; --accent-soft: rgba(45,212,167,0.14);
    --accent-ink: #04140f; --red: #ff6b5e; --red-soft: rgba(255,107,94,0.14);
    --amber: #f2b134; --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f2e8; --surface: #fffdf8; --surface-2: #efe9d7;
      --border: #ddd4bc; --text: #16211b; --text-muted: #5f6a60;
      --accent: #0f8f70; --accent-dim: #0c6e56; --accent-soft: rgba(15,143,112,0.1);
      --accent-ink: #f5fffb; --red: #c8433a; --red-soft: rgba(200,67,58,0.1); --amber: #b3791b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    background-color: var(--bg);
    background-image: linear-gradient(rgba(45,212,167,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(45,212,167,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text); font-family: 'Archivo', -apple-system, sans-serif;
  }
  #app { width: 100%; max-width: 700px; padding: 20px 16px 48px; }
  .brandbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 18px;
  }
  .brandbar .tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .brandbar .title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; margin-top: 2px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px 22px; box-shadow: 0 8px 24px -12px rgba(0,0,0,0.3);
  }
  h1 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0 0 10px; }
  p.lead { font-size: 15px; line-height: 1.6; color: var(--text-muted); margin: 0 0 18px; }
  .stat-row { display: flex; gap: 10px; margin: 18px 0; }
  .stat { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
  .stat .num { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: var(--accent); display: block; }
  .stat .lbl { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  button { font-family: inherit; cursor: pointer; }
  button.primary {
    width: 100%; padding: 13px; margin-top: 10px; background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
  }
  button.secondary {
    width: 100%; padding: 11px; margin-top: 10px; background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent); border-radius: 10px; font-size: 14px;
  }
  button.ghost {
    padding: 7px 12px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 20px; font-size: 12px;
  }
  button.ghost.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .progress-bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }
  .cat-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; display: inline-block; margin-bottom: 10px; }
  .strip-wrap { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 14px; overflow-x: auto; }
  .strip-wrap svg { display: block; min-width: 640px; }
  .q-prompt { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .hint-box { font-size: 13.5px; color: var(--text-muted); background: var(--surface-2); border-left: 2px solid var(--accent); padding: 8px 12px; border-radius: 6px; margin: 10px 0; display: none; }
  .hint-box.show { display: block; }
  input.answer {
    width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--text); margin-top: 6px;
  }
  input.answer:focus { outline: none; border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row button { flex: 1; }
  .feedback { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--accent-soft); border-left: 3px solid var(--accent); }
  .feedback.incorrect { background: var(--red-soft); border-left: 3px solid var(--red); }
  .feedback b { display: block; margin-bottom: 4px; }
  .skip-link-btn { display: block; text-align: center; width: 100%; background: none; border: none; color: var(--text-muted); font-size: 12.5px; margin-top: 10px; text-decoration: underline; }
  .review-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .review-item:last-child { border-bottom: none; }
  .review-item .r-prompt { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .review-item .r-status { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-bottom: 6px; }
  .r-status.correct { background: var(--accent-soft); color: var(--accent); }
  .r-status.wrong { background: var(--red-soft); color: var(--red); }
  .r-status.skipped { background: var(--surface-2); color: var(--text-muted); }
  .r-detail { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="app">
  <div class="brandbar">
    <div>
      <div class="tag">Cardiology · Quiz Game</div>
      <div class="title">Rhythm Strip ID</div>
    </div>
  </div>
  <div id="screen"></div>
</div>
<script>
(function () {
  "use strict";

  var BASE_Y = 100;

  function beatSegment(x0, o) {
    var x = x0;
    var d = "";
    if (o.p === "normal") {
      d += " Q" + (x + 8) + "," + (BASE_Y - o.pAmp) + " " + (x + 16) + "," + BASE_Y;
      x += 16;
    } else if (o.p === "flutter") {
      for (var i = 0; i < 3; i++) {
        d += " L" + (x + 4) + "," + (BASE_Y - 10) + " L" + (x + 8) + "," + BASE_Y;
        x += 8;
      }
    } else if (o.p === "fib") {
      for (var j = 0; j < 4; j++) {
        var amp = 2 + Math.random() * 4;
        d += " L" + (x + 5) + "," + (BASE_Y - amp) + " L" + (x + 10) + "," + (BASE_Y + amp * 0.5);
        x += 5;
      }
    }
    var prTarget = x0 + (o.p === "normal" ? 16 : 0) + o.prLen;
    if (x < prTarget) {
      if (o.prDip) {
        d += " L" + (prTarget - 6) + "," + (BASE_Y + 5) + " L" + prTarget + "," + BASE_Y;
      } else {
        d += " L" + prTarget + "," + BASE_Y;
      }
      x = prTarget;
    }
    if (o.qrs === "wide") {
      d += " L" + (x + 10) + "," + (BASE_Y + 14) + " L" + (x + 22) + "," + (BASE_Y - o.rHeight) + " L" + (x + 34) + "," + (BASE_Y + o.sDepth) + " L" + (x + 44) + "," + BASE_Y;
      x += 44;
    } else if (o.qrs === "delta") {
      d += " L" + (x + 10) + "," + (BASE_Y - 12) + " L" + (x + 16) + "," + (BASE_Y - o.rHeight) + " L" + (x + 24) + "," + (BASE_Y + o.sDepth) + " L" + (x + 30) + "," + BASE_Y;
      x += 30;
    } else {
      d += " L" + (x + 6) + "," + (BASE_Y + 8) + " L" + (x + 14) + "," + (BASE_Y - o.rHeight) + " L" + (x + 22) + "," + (BASE_Y + o.sDepth) + " L" + (x + 26) + "," + BASE_Y;
      x += 26;
    }
    var stTarget = x + o.stFlat;
    d += " L" + stTarget + "," + (BASE_Y + o.stLevel);
    x = stTarget;
    if (o.t === "flat") {
      d += " L" + (x + 20) + "," + (BASE_Y + o.stLevel);
      x += 20;
    } else {
      var sign = o.tInverted ? 1 : -1;
      var tw = o.t === "peaked" ? 20 : 30;
      d += " Q" + (x + tw * 0.5) + "," + (BASE_Y + o.stLevel + sign * o.tAmp) + " " + (x + tw) + "," + BASE_Y;
      x += tw;
    }
    return { d: d, endX: x };
  }

  function generateStrip(preset, beats, width) {
    var svgW = width || 900;
    var svgH = 200;
    var d = "M0," + BASE_Y;
    var x = 0;
    if (preset.dissociated) {
      // Third-degree AV block: independent P and QRS marches.
      var pInterval = 55, qrsInterval = 95;
      var px = 20;
      while (px < svgW - 10) {
        d += " M" + px + "," + BASE_Y + " Q" + (px + 8) + "," + (BASE_Y - 8) + " " + (px + 16) + "," + BASE_Y;
        px += pInterval;
      }
      var qx = 40;
      while (qx < svgW - 30) {
        var seg = beatSegment(qx, { p: "none", prLen: 0, qrs: "normal", rHeight: 45, sDepth: 25, stFlat: 10, stLevel: 0, t: "normal", tAmp: 15, tInverted: false });
        d += " M" + qx + "," + BASE_Y + seg.d;
        qx += qrsInterval;
      }
      return { d: d, w: svgW, h: svgH };
    }
    var i = 0;
    while (x < svgW - 60 && i < beats) {
      var cycle = preset.cycleLen + (preset.jitter ? (Math.random() - 0.5) * preset.jitter : 0);
      var fixed = (preset.p === "normal" ? 16 : preset.p === "flutter" ? 24 : preset.p === "fib" ? 20 : 0) + preset.prLen + (preset.qrs === "wide" ? 44 : preset.qrs === "delta" ? 30 : 26) + preset.stFlat + (preset.t === "flat" ? 20 : preset.t === "peaked" ? 20 : 30);
      var leadIn = Math.max(6, cycle - fixed);
      x += leadIn;
      var o = preset;
      if (preset.torsades) {
        var wobble = Math.sin(i * 1.3) * 20;
        o = Object.assign({}, preset, { rHeight: 35 + wobble, sDepth: 15 - wobble * 0.6 });
      }
      var seg = beatSegment(x, o);
      d += " L" + x + "," + BASE_Y + seg.d;
      x = seg.endX;
      i++;
    }
    d += " L" + svgW + "," + BASE_Y;
    return { d: d, w: svgW, h: svgH };
  }

  function stripSVG(preset, beats) {
    var s = generateStrip(preset, beats, 900);
    return '<svg viewBox="0 0 ' + s.w + ' ' + s.h + '" width="' + s.w + '" height="' + s.h + '" role="img" aria-label="ECG rhythm strip">' +
      '<path d="' + s.d + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>';
  }

  var RHYTHMS = [
    { id: "nsr", name: "Normal Sinus Rhythm", cat: "Sinus", beats: 6,
      preset: { p: "normal", pAmp: 8, prLen: 20, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 10, stLevel: 0, t: "normal", tAmp: 16, tInverted: false, cycleLen: 130 } },
    { id: "brady", name: "Sinus Bradycardia", cat: "Sinus", beats: 4,
      preset: { p: "normal", pAmp: 8, prLen: 20, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 10, stLevel: 0, t: "normal", tAmp: 16, tInverted: false, cycleLen: 210 } },
    { id: "tachy", name: "Sinus Tachycardia", cat: "Sinus", beats: 8,
      preset: { p: "normal", pAmp: 8, prLen: 18, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 8, stLevel: 0, t: "normal", tAmp: 15, tInverted: false, cycleLen: 90 } },
    { id: "afib", name: "Atrial Fibrillation", cat: "Atrial", beats: 8,
      preset: { p: "fib", prLen: 4, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 8, stLevel: 0, t: "normal", tAmp: 15, tInverted: false, cycleLen: 120, jitter: 90 } },
    { id: "aflutter", name: "Atrial Flutter", cat: "Atrial", beats: 6,
      preset: { p: "flutter", prLen: 10, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 8, stLevel: 0, t: "normal", tAmp: 15, tInverted: false, cycleLen: 150 } },
    { id: "avb1", name: "First-Degree AV Block", cat: "Conduction Block", beats: 5,
      preset: { p: "normal", pAmp: 8, prLen: 55, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 10, stLevel: 0, t: "normal", tAmp: 16, tInverted: false, cycleLen: 160 } },
    { id: "avb3", name: "Third-Degree (Complete) AV Block", cat: "Conduction Block", beats: 0, dissociated: true },
    { id: "wpw", name: "Wolff-Parkinson-White", cat: "Conduction Block", beats: 5,
      preset: { p: "normal", pAmp: 7, prLen: 8, qrs: "delta", rHeight: 50, sDepth: 20, stFlat: 8, stLevel: 0, t: "normal", tAmp: 14, tInverted: false, cycleLen: 140 } },
    { id: "vtach", name: "Ventricular Tachycardia", cat: "Ventricular", beats: 8,
      preset: { p: "none", prLen: 0, qrs: "wide", rHeight: 60, sDepth: 35, stFlat: 4, stLevel: 0, t: "flat", tAmp: 3, tInverted: false, cycleLen: 90 } },
    { id: "pvc", name: "Premature Ventricular Contraction", cat: "Ventricular", beats: 5,
      preset: { p: "normal", pAmp: 8, prLen: 20, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 10, stLevel: 0, t: "normal", tAmp: 16, tInverted: false, cycleLen: 130 } },
    { id: "torsades", name: "Torsades de Pointes", cat: "Ventricular", beats: 10,
      preset: { p: "none", prLen: 0, qrs: "wide", rHeight: 40, sDepth: 20, stFlat: 4, stLevel: 0, t: "flat", tAmp: 3, tInverted: false, cycleLen: 70, torsades: true } },
    { id: "stemi", name: "ST-Elevation MI", cat: "Ischemic/Electrolyte", beats: 5,
      preset: { p: "normal", pAmp: 8, prLen: 20, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 14, stLevel: -22, t: "normal", tAmp: 14, tInverted: false, cycleLen: 150 } },
    { id: "pericarditis", name: "Acute Pericarditis", cat: "Ischemic/Electrolyte", beats: 5,
      preset: { p: "normal", pAmp: 8, prLen: 20, prDip: true, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 14, stLevel: -14, t: "normal", tAmp: 14, tInverted: false, cycleLen: 150 } },
    { id: "hyperk", name: "Hyperkalemia (Peaked T Waves)", cat: "Ischemic/Electrolyte", beats: 5,
      preset: { p: "normal", pAmp: 4, prLen: 20, qrs: "normal", rHeight: 55, sDepth: 22, stFlat: 6, stLevel: 0, t: "peaked", tAmp: 42, tInverted: false, cycleLen: 150 } }
  ];

  function q(rhythm, kind, prompt, answers, hint, explain) {
    return { rid: rhythm.id, name: rhythm.name, cat: rhythm.cat, kind: kind, prompt: prompt, answers: answers, hint: hint, explain: explain };
  }

  var ALL_QUESTIONS = [
    q(RHYTHMS[0], "id", "What rhythm is this?", ["normal sinus rhythm", "sinus rhythm", "nsr"], "Regular P before every QRS, normal rate, normal intervals.", "Normal sinus rhythm: regular rate 60-100bpm, a P wave before every QRS, normal PR and QRS intervals."),
    q(RHYTHMS[0], "next", "What is the appropriate management?", ["none", "no treatment needed", "observe", "reassurance"], "This is a normal finding.", "NSR is a normal rhythm — no intervention is needed."),
    q(RHYTHMS[1], "id", "What rhythm is this?", ["sinus bradycardia", "bradycardia"], "Same shape as normal sinus rhythm, just slower.", "Sinus bradycardia: normal P-QRS-T morphology but rate <60bpm."),
    q(RHYTHMS[1], "next", "What determines whether this needs treatment?", ["symptoms", "whether the patient is symptomatic", "hemodynamic stability"], "Rate alone doesn't dictate therapy.", "Asymptomatic sinus bradycardia (common in athletes) needs no treatment; symptomatic bradycardia (hypotension, syncope) may need atropine or pacing."),
    q(RHYTHMS[2], "id", "What rhythm is this?", ["sinus tachycardia", "tachycardia"], "Same shape as normal sinus rhythm, just faster.", "Sinus tachycardia: normal P-QRS-T morphology but rate >100bpm."),
    q(RHYTHMS[2], "next", "What's the best first step in management?", ["identify and treat the underlying cause", "treat the underlying cause", "find the cause"], "This is usually a response to something else (fever, pain, hypovolemia).", "Sinus tachycardia is typically a compensatory response — treat the underlying cause rather than the rate itself."),
    q(RHYTHMS[3], "id", "What rhythm is this?", ["atrial fibrillation", "afib", "a-fib"], "Irregularly irregular rhythm with no discrete P waves.", "Atrial fibrillation: chaotic atrial activity produces an irregularly irregular ventricular rhythm with no discrete P waves."),
    q(RHYTHMS[3], "next", "What two management pillars must be addressed?", ["rate or rhythm control and stroke risk", "rate control and anticoagulation", "rate/rhythm control and anticoagulation"], "Think heart rate AND clot risk.", "AFib management requires both rate/rhythm control and stroke-risk stratification (e.g., CHA2DS2-VASc) to guide anticoagulation."),
    q(RHYTHMS[4], "id", "What rhythm is this?", ["atrial flutter", "aflutter", "a-flutter"], "Regular sawtooth waves between QRS complexes.", "Atrial flutter shows a regular sawtooth pattern of flutter waves, often with a fixed conduction ratio to the ventricles."),
    q(RHYTHMS[4], "next", "Which structure is targeted by catheter ablation for typical atrial flutter?", ["cavotricuspid isthmus", "the cavotricuspid isthmus", "tricuspid isthmus"], "A discrete right-atrial reentry circuit.", "Typical atrial flutter results from a macro-reentrant circuit through the cavotricuspid isthmus, the target of ablation therapy."),
    q(RHYTHMS[5], "id", "What rhythm is this?", ["first-degree av block", "first degree av block", "1st degree av block"], "Every P is followed by a QRS, but the PR interval is too long.", "First-degree AV block: PR interval >200ms, but every P wave still conducts to a QRS."),
    q(RHYTHMS[5], "next", "Does this rhythm typically require treatment?", ["no", "not usually", "rarely"], "It's often an incidental, benign finding.", "First-degree AV block is usually asymptomatic and doesn't require treatment on its own."),
    q(RHYTHMS[6], "id", "What rhythm is this?", ["third-degree av block", "complete heart block", "third degree av block", "complete av block"], "P waves and QRS complexes march at their own independent rates.", "Complete heart block: no atrial impulses conduct to the ventricles — P waves and QRS complexes are fully dissociated."),
    q(RHYTHMS[6], "next", "What is the definitive treatment?", ["pacemaker", "permanent pacemaker", "cardiac pacing"], "The ventricles need a reliable, independent trigger.", "Complete heart block is an indication for a permanent pacemaker, since the ventricular escape rhythm is unreliable."),
    q(RHYTHMS[7], "id", "What rhythm/syndrome is this?", ["wolff-parkinson-white", "wpw", "wolff parkinson white syndrome"], "A short PR interval with a slurred upstroke into the QRS.", "WPW syndrome: an accessory conduction pathway produces a short PR interval and a delta wave (slurred QRS upstroke)."),
    q(RHYTHMS[7], "next", "Which drug class should be avoided if this patient develops atrial fibrillation?", ["av nodal blockers", "av nodal blocking agents", "nodal blockers"], "They can promote conduction down the accessory pathway.", "AV nodal blockers can paradoxically increase conduction down the accessory pathway in WPW + AFib, risking degeneration to VFib."),
    q(RHYTHMS[8], "id", "What rhythm is this?", ["ventricular tachycardia", "vtach", "v-tach", "vt"], "Wide, regular, fast QRS complexes with no visible P waves.", "Ventricular tachycardia: a regular, wide-complex rhythm at a fast rate, originating below the AV node."),
    q(RHYTHMS[8], "next", "A pulseless patient in this rhythm needs what immediate intervention?", ["defibrillation", "immediate defibrillation", "electrical cardioversion"], "This is a shockable rhythm.", "Pulseless VT is treated like VFib: immediate defibrillation plus ACLS."),
    q(RHYTHMS[9], "id", "What is this abnormal beat called?", ["premature ventricular contraction", "pvc", "ventricular ectopic"], "An early, wide, bizarre beat interrupting an otherwise regular rhythm.", "A PVC is an early ventricular beat with a wide, bizarre QRS morphology, often followed by a compensatory pause."),
    q(RHYTHMS[9], "next", "Are occasional PVCs in an otherwise healthy patient usually concerning?", ["no", "not usually", "generally benign"], "Very common and usually incidental.", "Occasional PVCs are common and usually benign in patients without structural heart disease."),
    q(RHYTHMS[10], "id", "What rhythm is this?", ["torsades de pointes", "torsades", "tdp"], "A wide-complex rhythm that appears to twist around the baseline.", "Torsades de pointes is a polymorphic VT where the QRS axis twists around the isoelectric baseline, classically from a prolonged QT."),
    q(RHYTHMS[10], "next", "What is the first-line acute treatment?", ["iv magnesium", "magnesium sulfate", "iv magnesium sulfate"], "The same electrolyte covered elsewhere in this app's cardiology content.", "IV magnesium sulfate is first-line for torsades, regardless of serum magnesium level."),
    q(RHYTHMS[11], "id", "What does this ST pattern suggest?", ["st elevation mi", "stemi", "st-elevation myocardial infarction"], "Localized ST-segment elevation without PR depression.", "ST-segment elevation in a coronary territory indicates an acute STEMI, requiring emergent reperfusion."),
    q(RHYTHMS[11], "next", "What is the target door-to-balloon time for PCI?", ["90 minutes", "90 min", "within 90 minutes"], "A well-known ACS quality metric.", "Guidelines target a door-to-balloon time of 90 minutes or less for primary PCI in STEMI."),
    q(RHYTHMS[12], "id", "What does this ST/PR pattern suggest?", ["acute pericarditis", "pericarditis"], "Diffuse ST elevation plus PR-segment depression.", "Acute pericarditis classically shows diffuse ST elevation with associated PR-segment depression."),
    q(RHYTHMS[12], "next", "What symptom pattern supports this diagnosis?", ["pleuritic pain relieved by sitting forward", "chest pain relieved by leaning forward", "positional pleuritic chest pain"], "Positional chest pain.", "Pericarditis classically causes sharp, pleuritic chest pain that improves when the patient sits up and leans forward."),
    q(RHYTHMS[13], "id", "What does this T-wave change suggest?", ["hyperkalemia", "peaked t waves from hyperkalemia"], "Tall, narrow, tented T waves.", "Early hyperkalemia produces tall, peaked ('tented') T waves — an early warning sign before more dangerous conduction changes."),
    q(RHYTHMS[13], "next", "What is given first to stabilize the myocardium?", ["iv calcium gluconate", "calcium gluconate", "iv calcium"], "Doesn't lower potassium — it protects the heart directly.", "IV calcium gluconate stabilizes the cardiac membrane immediately; it doesn't lower serum potassium but buys time for other measures.")
  ];

  var CATEGORIES = [];
  ALL_QUESTIONS.forEach(function (item) { if (CATEGORIES.indexOf(item.cat) === -1) CATEGORIES.push(item.cat); });

  var state = { selectedCats: CATEGORIES.slice(), pool: [], idx: 0, results: [], hintShown: false, answered: false };

  function el(id) { return document.getElementById(id); }
  function normalize(s) { return s.toLowerCase().trim().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " "); }
  function isCorrect(input, answers) {
    var n = normalize(input);
    if (!n) return false;
    return answers.some(function (a) { return normalize(a) === n || n.indexOf(normalize(a)) !== -1 || normalize(a).indexOf(n) !== -1; });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function renderStart() {
    var savedBest = localStorage.getItem("rhythmgame:best");
    el("screen").innerHTML =
      '<div class="card">' +
      '<h1>Rhythm Strip ID</h1>' +
      '<p class="lead">14 classic ECG rhythms, generated on the fly — name each strip, then answer a quick follow-up on management or mechanism.</p>' +
      '<div class="stat-row">' +
      '<div class="stat"><span class="num">' + ALL_QUESTIONS.length + '</span><span class="lbl">Questions</span></div>' +
      '<div class="stat"><span class="num">' + RHYTHMS.length + '</span><span class="lbl">Rhythms</span></div>' +
      '<div class="stat"><span class="num">' + (savedBest || '—') + '</span><span class="lbl">Best score</span></div>' +
      '</div>' +
      '<div class="chip-row" id="cat-chips"></div>' +
      '<button class="primary" id="btn-start">Start quiz</button>' +
      '</div>';
    var chipRow = el("cat-chips");
    CATEGORIES.forEach(function (cat) {
      var b = document.createElement("button");
      b.className = "ghost active";
      b.textContent = cat;
      b.dataset.cat = cat;
      b.addEventListener("click", function () {
        var i = state.selectedCats.indexOf(cat);
        if (i === -1) { state.selectedCats.push(cat); b.classList.add("active"); }
        else { state.selectedCats.splice(i, 1); b.classList.remove("active"); }
      });
      chipRow.appendChild(b);
    });
    el("btn-start").addEventListener("click", startQuiz);
  }

  function startQuiz() {
    var filtered = ALL_QUESTIONS.filter(function (q) { return state.selectedCats.indexOf(q.cat) !== -1; });
    if (filtered.length === 0) filtered = ALL_QUESTIONS.slice();
    state.pool = shuffle(filtered);
    state.idx = 0;
    state.results = [];
    renderQuestion();
  }

  function currentRhythm(item) {
    for (var i = 0; i < RHYTHMS.length; i++) if (RHYTHMS[i].id === item.rid) return RHYTHMS[i];
    return RHYTHMS[0];
  }

  function renderQuestion() {
    state.hintShown = false;
    state.answered = false;
    var item = state.pool[state.idx];
    var rhythm = currentRhythm(item);
    var pct = Math.round((state.idx / state.pool.length) * 100);
    el("screen").innerHTML =
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="card">' +
      '<span class="cat-tag">' + item.cat + ' · ' + (state.idx + 1) + ' / ' + state.pool.length + '</span>' +
      '<div class="strip-wrap">' + stripSVG(rhythm.dissociated ? {} : rhythm.preset, rhythm.beats) + '</div>' +
      '<p class="q-prompt">' + item.prompt + '</p>' +
      '<button class="skip-link-btn" id="btn-hint" style="text-align:left;padding:0;margin:0 0 4px;">Show hint</button>' +
      '<div class="hint-box" id="hint-box">' + item.hint + '</div>' +
      '<form id="answer-form">' +
      '<input class="answer" id="answer-input" type="text" autocomplete="off" placeholder="Type your answer..." />' +
      '<div class="btn-row">' +
      '<button type="button" class="secondary" id="btn-skip">Skip</button>' +
      '<button type="submit" class="primary" id="btn-submit">Submit</button>' +
      '</div>' +
      '</form>' +
      '<div class="feedback" id="feedback"></div>' +
      '<button class="skip-link-btn" id="btn-next" style="display:none;">Next question →</button>' +
      '</div>';

    el("btn-hint").addEventListener("click", function () {
      state.hintShown = true;
      el("hint-box").classList.add("show");
    });
    el("btn-skip").addEventListener("click", function () { recordAnswer("", true); });
    el("answer-form").addEventListener("submit", function (e) {
      e.preventDefault();
      if (state.answered) return;
      recordAnswer(el("answer-input").value, false);
    });
    el("btn-next").addEventListener("click", advance);
    setTimeout(function () { var i = el("answer-input"); if (i) i.focus(); }, 30);
  }

  function recordAnswer(value, skipped) {
    if (state.answered) return;
    state.answered = true;
    var item = state.pool[state.idx];
    var correct = !skipped && isCorrect(value, item.answers);
    state.results.push({ item: item, userAnswer: value, status: skipped ? "skipped" : correct ? "correct" : "wrong" });

    var fb = el("feedback");
    fb.className = "feedback show " + (skipped ? "incorrect" : correct ? "correct" : "incorrect");
    var label = correct ? "Correct!" : skipped ? "Skipped." : "Not quite.";
    fb.innerHTML = "<b>" + label + "</b>" + (correct ? "" : "Expected: " + item.answers[0] + ". ") + item.explain;

    el("btn-submit").disabled = true;
    el("btn-skip").disabled = true;
    el("answer-input").disabled = true;
    el("btn-next").style.display = "block";
    if (state.idx === state.pool.length - 1) {
      el("btn-next").textContent = "See results →";
    }
  }

  function advance() {
    if (state.idx < state.pool.length - 1) {
      state.idx++;
      renderQuestion();
    } else {
      renderResults();
    }
  }

  function renderResults() {
    var correct = state.results.filter(function (r) { return r.status === "correct"; }).length;
    var total = state.results.length;
    var pct = Math.round((correct / total) * 100);
    var best = parseInt(localStorage.getItem("rhythmgame:best") || "0", 10);
    if (pct > best) localStorage.setItem("rhythmgame:best", String(pct));

    el("screen").innerHTML =
      '<div class="card">' +
      '<h1>Results</h1>' +
      '<div class="stat-row">' +
      '<div class="stat"><span class="num">' + correct + '/' + total + '</span><span class="lbl">Correct</span></div>' +
      '<div class="stat"><span class="num">' + pct + '%</span><span class="lbl">Score</span></div>' +
      '</div>' +
      '<button class="primary" id="btn-restart">Play again</button>' +
      '<button class="secondary" id="btn-review">Review all answers</button>' +
      '<div id="review-list"></div>' +
      '</div>';
    el("btn-restart").addEventListener("click", renderStart);
    el("btn-review").addEventListener("click", function () {
      var list = el("review-list");
      list.innerHTML = state.results.map(function (r) {
        return '<div class="review-item">' +
          '<span class="r-status ' + r.status + '">' + r.status + '</span>' +
          '<div class="r-prompt">' + r.item.name + ' — ' + r.item.prompt + '</div>' +
          '<div class="r-detail">' + (r.status !== "correct" ? "Your answer: " + (r.userAnswer || "(none)") + ". " : "") + "Expected: " + r.item.answers[0] + ". " + r.item.explain + '</div>' +
          '</div>';
      }).join("");
    });
  }

  renderStart();
})();
</script>
</body>
</html>
